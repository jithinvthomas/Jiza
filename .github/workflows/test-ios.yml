name: Test Jiza iPhone app
on:
  push:
    branches:
      - fix/iphone-layout-folder-picker
      - feature/jiza-home-hub
  workflow_dispatch:
permissions:
  contents: read
jobs:
  simulator:
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-14, macos-26]
    runs-on: ${{ matrix.runner }}
    env:
      NATIVE_GLASS: ${{ matrix.runner == 'macos-26' }}
    steps:
      - uses: actions/checkout@v4
      - name: Check Xcode and SDK
        run: |
          xcodebuild -version
          if [ "$NATIVE_GLASS" = "true" ]; then
            SDK_MAJOR=$(xcrun --sdk iphonesimulator --show-sdk-version | cut -d. -f1)
            test "$SDK_MAJOR" -ge 26
          fi
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: |
          xcodegen generate
          sed -i '' 's/objectVersion = 77;/objectVersion = 60;/' InteraMusicPlayer.xcodeproj/project.pbxproj
      - name: Select available iPhone simulator
        # CocoaPods provides the official checksum-verified VLCKit XCFramework.
        run: |
          DEVICE_ID=$(xcrun simctl list devices available -j | python3 -c 'import json,os,sys; d=json.load(sys.stdin); native=os.environ["NATIVE_GLASS"]=="true"; print(next(v["udid"] for k,vs in d["devices"].items() if "iOS" in k and (not native or "iOS-26" in k) for v in vs if "iPhone" in v["name"]))')
          echo "DEVICE_ID=$DEVICE_ID" >> "$GITHUB_ENV"
      - name: Install playback framework
        run: |
          brew list cocoapods >/dev/null 2>&1 || brew install cocoapods
          pod install
          cat Podfile.lock
      - name: Build and test without packaging an IPA
        run: |
          xcodebuild test -workspace InteraMusicPlayer.xcworkspace -scheme InteraMusicPlayer -destination "platform=iOS Simulator,id=$DEVICE_ID" -resultBundlePath TestResults.xcresult CODE_SIGNING_ALLOWED=NO
      - name: Export simulator screenshots
        if: always()
        run: python3 export_test_images.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: iPhone-test-results-${{ matrix.runner }}
          path: |
            TestResults.xcresult
            test-images
            Podfile.lock
