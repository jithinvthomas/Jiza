name: Build Jiza IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-26

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: bash TorrentNative/build.sh iphoneos arm64 && xcodegen generate

      - name: Normalize project format
        run: |
          sed -i '' 's/objectVersion = 77;/objectVersion = 60;/' InteraMusicPlayer.xcodeproj/project.pbxproj

      - name: Build unsigned iOS archive
        # Dependencies must be integrated before using the workspace.
        run: |
          brew list cocoapods >/dev/null 2>&1 || brew install cocoapods
          pod install

      - name: Archive app
        run: |
          xcodebuild archive \
            -workspace InteraMusicPlayer.xcworkspace \
            -scheme InteraMusicPlayer \
            -sdk iphoneos \
            -configuration Release \
            -archivePath "$PWD/build/InteraMusicPlayer.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Package unsigned IPA
        run: |
          mkdir -p build/Payload
          cp -R build/InteraMusicPlayer.xcarchive/Products/Applications/InteraMusic.app build/Payload/
          cd build
          /usr/bin/zip -r InteraMusicPlayer-unsigned.ipa Payload

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: InteraMusicPlayer-IPA
          path: build/InteraMusicPlayer-unsigned.ipa
          if-no-files-found: error
