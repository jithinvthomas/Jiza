name: Build Jiza IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - finish/jiza-all-in-one
      - feature/jiza-terminal-controls

permissions:
  contents: read

concurrency:
  group: jiza-ipa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    uses: ./.github/workflows/test-ios.yml

  build:
    needs: verify
    runs-on: macos-26

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Select release Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.6.app/Contents/Developer

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: bash TorrentNative/build.sh iphoneos arm64 && bash NativeShell/build.sh iphoneos arm64 && xcodegen generate

      - name: Normalize project format
        run: |
          sed -i '' 's/objectVersion = 77;/objectVersion = 60;/' Jiza.xcodeproj/project.pbxproj

      - name: Build unsigned iOS archive
        # Dependencies must be integrated before using the workspace.
        run: |
          brew list cocoapods >/dev/null 2>&1 || brew install cocoapods
          pod install

      - name: Archive app
        run: |
          xcodebuild archive \
            -workspace Jiza.xcworkspace \
            -scheme Jiza \
            -sdk iphoneos \
            -configuration Release \
            -archivePath "$PWD/build/Jiza.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Package unsigned IPA
        run: |
          mkdir -p build/Payload
          cp -R build/Jiza.xcarchive/Products/Applications/Jiza.app build/Payload/
          cd build
          /usr/bin/zip -r Jiza-unsigned.ipa Payload

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: Jiza-IPA
          path: build/Jiza-unsigned.ipa
          if-no-files-found: error
