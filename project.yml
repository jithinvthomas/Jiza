name: InteraMusicPlayer

options:
  deploymentTarget:
    iOS: 16.0
  bundleIdPrefix: com.interaauditsolutions

settings:
  base:
    SWIFT_VERSION: 5.0

targets:
  InteraMusicPlayer:
    type: application
    platform: iOS
    deploymentTarget: 16.0
    sources:
      - AudioPlayerModel.swift
      - VideoPlayerModel.swift
      - PreparedVideoFile.swift
      - VideoPlayerView.swift
      - VideoLibraryView.swift
      - ContentView.swift
      - JizaHomeView.swift
      - TradingDashboardView.swift
      - SharedInbox.swift
      - TorrentModel.swift
      - JizaDesign.swift
      - BrowserModel.swift
      - BrowserDownloads.swift
      - BrowserView.swift
      - BrowserDownloadPolicy.swift
      - BrowserProtection.swift
      - path: BrowserAdDomains.json
        buildPhase: resources
      - AppSecurity.swift
      - SecurityViews.swift
      - InteraMusicPlayerApp.swift
      - Assets.xcassets
      - path: Licenses
        buildPhase: resources
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: Jiza
        NSFaceIDUsageDescription: Unlock Jiza and manage your browser PIN with Face ID.
        UILaunchScreen: {}
        LSSupportsOpeningDocumentsInPlace: true
        UIFileSharingEnabled: true
        NSAppTransportSecurity:
          NSAllowsArbitraryLoadsInWebContent: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIBackgroundModes:
          - audio
        CFBundleDocumentTypes:
          - CFBundleTypeName: Torrent Files
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - org.bittorrent.torrent
          - CFBundleTypeName: Audio Files
            LSHandlerRank: Owner
            LSItemContentTypes:
              - public.audio
          - CFBundleTypeName: Video Files
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - public.movie
        UTImportedTypeDeclarations:
          - UTTypeIdentifier: org.bittorrent.torrent
            UTTypeDescription: BitTorrent metadata
            UTTypeConformsTo: [public.data]
            UTTypeTagSpecification:
              public.filename-extension: torrent
              public.mime-type: application/x-bittorrent
        CFBundleURLTypes:
          - CFBundleURLName: Magnet links
            CFBundleURLSchemes: [magnet]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.interaauditsolutions.music
        PRODUCT_NAME: InteraMusic
        SWIFT_OBJC_BRIDGING_HEADER: TorrentNative/JizaTorrent.h
        LIBRARY_SEARCH_PATHS: "$(inherited) $(PROJECT_DIR)/NativeBuild/$(PLATFORM_NAME)"
        OTHER_LDFLAGS: "$(inherited) -lJizaTorrentCombined -lc++ -lz -framework SystemConfiguration -framework Security"
        CODE_SIGN_ENTITLEMENTS: Jiza.entitlements
        CODE_SIGN_ENTITLEMENTS[sdk=iphonesimulator*]: Simulator.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: NO

    dependencies:
      - target: JizaShare

  JizaShare:
    type: app-extension
    platform: iOS
    deploymentTarget: 16.0
    sources:
      - ShareExtension/ShareViewController.swift
      - SharedInbox.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.interaauditsolutions.music.share
        CODE_SIGN_ENTITLEMENTS: Jiza.entitlements
        APPLICATION_EXTENSION_API_ONLY: YES
    info:
      path: ShareExtension/Info.plist
      properties:
        CFBundleDisplayName: Jiza
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsFileWithMaxCount: 20
              NSExtensionActivationSupportsImageWithMaxCount: 20
              NSExtensionActivationSupportsMovieWithMaxCount: 20
              NSExtensionActivationSupportsWebURLWithMaxCount: 20
              NSExtensionActivationSupportsText: true

  InteraMusicPlayerTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: 16.0
    sources:
      - AudioPlayerModelTests.swift
      - VideoPlayerModelTests.swift
      - BrowserModelTests.swift
      - TradingDashboardTests.swift
      - TorrentTests.swift
      - AppSecurityTests.swift
      - path: TestFixtures
        buildPhase: resources
    dependencies:
      - target: InteraMusicPlayer
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/InteraMusic.app/InteraMusic"
        BUNDLE_LOADER: "$(TEST_HOST)"

  InteraMusicPlayerUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: 16.0
    sources:
      - MusicPlayerUITests.swift
    dependencies:
      - target: InteraMusicPlayer
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES

schemes:
  InteraMusicPlayer:
    build:
      targets:
        InteraMusicPlayer: all
    test:
      targets:
        - InteraMusicPlayerTests
        - InteraMusicPlayerUITests
