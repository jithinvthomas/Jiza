name: InteraMusicPlayer

options:
  deploymentTarget:
    iOS: 16.0
  bundleIdPrefix: com.interaauditsolutions

settings:
  base:
    SWIFT_VERSION: 5.0

targets:
  InteraMusicPlayer:
    type: application
    platform: iOS
    deploymentTarget: 16.0
    sources:
      - AudioPlayerModel.swift
      - VideoPlayerModel.swift
      - PreparedVideoFile.swift
      - VideoPlayerView.swift
      - VideoLibraryView.swift
      - ContentView.swift
      - JizaHomeView.swift
      - JizaDesign.swift
      - BrowserModel.swift
      - BrowserDownloads.swift
      - BrowserView.swift
      - BrowserDownloadPolicy.swift
      - BrowserProtection.swift
      - path: BrowserAdDomains.json
        buildPhase: resources
      - AppSecurity.swift
      - SecurityViews.swift
      - InteraMusicPlayerApp.swift
      - Assets.xcassets
      - path: Licenses
        buildPhase: resources
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: Jiza
        NSFaceIDUsageDescription: Unlock Jiza and manage your browser PIN with Face ID.
        UILaunchScreen: {}
        LSSupportsOpeningDocumentsInPlace: true
        UIFileSharingEnabled: true
        NSAppTransportSecurity:
          NSAllowsArbitraryLoadsInWebContent: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIBackgroundModes:
          - audio
        CFBundleDocumentTypes:
          - CFBundleTypeName: Audio Files
            LSHandlerRank: Owner
            LSItemContentTypes:
              - public.audio
          - CFBundleTypeName: Video Files
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - public.movie
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.interaauditsolutions.music
        PRODUCT_NAME: InteraMusic
        CODE_SIGN_ENTITLEMENTS[sdk=iphonesimulator*]: Simulator.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: NO

  InteraMusicPlayerTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: 16.0
    sources:
      - AudioPlayerModelTests.swift
      - VideoPlayerModelTests.swift
      - BrowserModelTests.swift
      - AppSecurityTests.swift
      - path: TestFixtures
        buildPhase: resources
    dependencies:
      - target: InteraMusicPlayer
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/InteraMusic.app/InteraMusic"
        BUNDLE_LOADER: "$(TEST_HOST)"

  InteraMusicPlayerUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: 16.0
    sources:
      - MusicPlayerUITests.swift
    dependencies:
      - target: InteraMusicPlayer
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES

schemes:
  InteraMusicPlayer:
    build:
      targets:
        InteraMusicPlayer: all
    test:
      targets:
        - InteraMusicPlayerTests
        - InteraMusicPlayerUITests
